<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Máy tính</title>
        <link rel="stylesheet" type="text/css" href="Styles/Cau8.css">
    </head>

    <body>
        <div id="calculator">
            <input type="text" id="num1" value="12">
            <button class="operator" data-op="+">+</button>
            <button class="operator" data-op="-">-</button>
            <button class="operator" data-op="*">x</button>
            <button class="operator" data-op="/">/</button>
            <button class="operator" data-op="^">^</button>
            <input type="text" id="num2" value="14">
            <span>=</span>
            <input type="text" id="result" readonly>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="Scripts/Cau8.js"></script>
    </body>
</html>
